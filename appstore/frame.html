<!doctype html>
<!-- App Store screenshot frame. Open frame.html?n=1..6 ; rendered by scripts/render.sh at 1320x2868 (6.9" iPhone).
     Drop the raw simulator capture at appstore/raw/<n>.png; until then the phone shows a labelled placeholder. -->
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1320px;height:2868px;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#fff;background:linear-gradient(180deg,#ff5e3a,#d41848);position:relative}
h1{position:absolute;top:150px;left:90px;right:90px;font-size:112px;line-height:1.05;letter-spacing:-.025em;text-align:center}
p{position:absolute;top:400px;left:140px;right:140px;font-size:50px;text-align:center;opacity:.9}
.phone{position:absolute;top:620px;left:215px;width:890px;height:2400px;border:22px solid #111;border-radius:130px;background:#1c1c1e;overflow:hidden;box-shadow:0 60px 120px rgba(0,0,0,.4)}
.phone div{position:absolute;inset:0;display:grid;place-items:center;color:#8e8e93;font-size:44px;text-align:center;padding:60px}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head>
<body>
<h1 id="h"></h1><p id="p"></p>
<div class="phone"><div id="ph"></div><img id="img" onerror="this.remove()"></div>
<script>
// Headlines mirror appstore/metadata.md, "Screenshots".
const S={1:["Every talk, one page","A report with the slides as figures"],
2:["The core ideas, as they land","A rolling summary while the talk runs"],
3:["Snap the slide, skip the typing","Detected, straightened, read on-device"],
4:["Live transcript, on your iPhone","Audio is never saved or uploaded"],
5:["PDF or web page, your pick","One document, two ways to share"],
6:["Pay for reports, not a plan","Recording and transcription are free"]};
const n=new URLSearchParams(location.search).get("n")||1;
h.textContent=S[n][0];p.textContent=S[n][1];
ph.textContent="raw/"+n+".png";img.src="raw/"+n+".png";
</script></body></html>
